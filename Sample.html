<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="This is a sample HTML page for web scraping.">
    <title>Sample Web Page</title>
</head>
<body>
    <h1>Welcome to Web Scraping</h1>
    <p>This is a paragraph with some <a href="https://example.com">example link</a>.</p>
    
    <div class="content-section">
        <p>Another paragraph inside a div.</p>
    </div>
    
    <div id="special-div">
        <p>Content inside a special div with ID.</p>
    </div>
    
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Alice</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>30</td>
        </tr>
    </table>
    
    <img src="image1.jpg" alt="Sample Image 1">
    <img src="image2.jpg" alt="Sample Image 2">
    
    <form action="submit.php">
        <input type="text" name="username" placeholder="Enter username">
        <input type="password" name="password" placeholder="Enter password">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
